name: Build ImmortalWrt for 360 T7 108M

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-360t7-108m-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      TZ: Asia/Shanghai
      SOURCE_REV: ba554197ed7e252fd3c1ee023621e1d1d009d323

    steps:
      # 先正常检出分支，避免短 SHA 直接检出导致 git exit code 1。
      # fetch-depth: 0 会取得完整历史，后续可稳定切换到指定源码提交。
      - name: Checkout workflow branch
        uses: actions/checkout@v4
        with:
          ref: openwrt-21.02
          fetch-depth: 0

      # 切换到与你可用 108M 固件一致的完整源码提交。
      - name: Pin verified source revision
        shell: bash
        run: |
          set -euo pipefail

          git cat-file -e "${SOURCE_REV}^{commit}"
          git checkout --detach "${SOURCE_REV}"

          test "$(git rev-parse HEAD)" = "${SOURCE_REV}"

          echo "========== Verified source =========="
          git log -1 --oneline
          git rev-parse HEAD

      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            libelf-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            ccache \
            device-tree-compiler \
            qemu-utils

      # 固定为你上传的可用 108M 固件中记录的 feeds 版本。
      - name: Pin verified feed revisions
        shell: bash
        run: |
          set -euo pipefail

          cat > feeds.conf.default <<'EOF'
          src-git-full packages https://github.com/immortalwrt/packages.git^e09f3c7d1903cfe7f523e209ab3ec778013ba309
          src-git-full luci https://github.com/immortalwrt/luci.git^5829eabba50ec0afa17d2ee486bc90dc15180c34
          src-git-full routing https://github.com/openwrt/routing.git^a9e43101bb726070cbf81b6225fc0625f4a4a5e5
          src-git-full telephony https://github.com/openwrt/telephony.git^f5120a46371ff75f401c1cb724c3880811bfbae0
          EOF

          echo "========== Pinned feeds =========="
          cat feeds.conf.default

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          test "$(git -C feeds/packages rev-parse HEAD)" = \
            "e09f3c7d1903cfe7f523e209ab3ec778013ba309"

          test "$(git -C feeds/luci rev-parse HEAD)" = \
            "5829eabba50ec0afa17d2ee486bc90dc15180c34"

          test "$(git -C feeds/routing rev-parse HEAD)" = \
            "a9e43101bb726070cbf81b6225fc0625f4a4a5e5"

          test "$(git -C feeds/telephony rev-parse HEAD)" = \
            "f5120a46371ff75f401c1cb724c3880811bfbae0"

          echo "========== Verified feed revisions =========="
          git -C feeds/packages rev-parse --short=12 HEAD
          git -C feeds/luci rev-parse --short=12 HEAD
          git -C feeds/routing rev-parse --short=12 HEAD
          git -C feeds/telephony rev-parse --short=12 HEAD

      - name: Prepare 360 T7 108M configuration
        shell: bash
        run: |
          set -euo pipefail

          # 使用仓库原始 MT7981 基础配置。
          cp -f defconfig/mt7981-ax3000.config .config

          # 删除基础配置中预选的所有 MT7981 路由器 Profile。
          sed -i \
            -e '/^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_/d' \
            -e '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_/d' \
            .config

          # 与可用 108M 固件一致：关闭多设备 Profile 和每设备独立 RootFS。
          sed -i \
            -e '/^CONFIG_TARGET_MULTI_PROFILE=/d' \
            -e '/^# CONFIG_TARGET_MULTI_PROFILE is not set$/d' \
            -e '/^CONFIG_TARGET_PER_DEVICE_ROOTFS=/d' \
            -e '/^# CONFIG_TARGET_PER_DEVICE_ROOTFS is not set$/d' \
            .config

          cat >> .config <<'EOF'
          # CONFIG_TARGET_MULTI_PROFILE is not set
          # CONFIG_TARGET_PER_DEVICE_ROOTFS is not set
          CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_mt7981-360-t7-108M=y
          EOF

          # 补齐依赖、删除无效选项。
          make defconfig

          # 必须只选中一个设备，且只能是 360T7 108M。
          target_count="$(grep -c '^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_.*=y$' .config || true)"

          test "${target_count}" -eq 1

          grep -qx \
            'CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_mt7981-360-t7-108M=y' \
            .config

          if grep -qx \
            'CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_mt7981-360-t7=y' \
            .config; then
            echo "ERROR: Wrong 36M profile was selected."
            exit 1
          fi

          if grep -qx 'CONFIG_TARGET_MULTI_PROFILE=y' .config || \
             grep -qx 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' .config; then
            echo "ERROR: Multi-profile or per-device RootFS was unexpectedly enabled."
            exit 1
          fi

          echo "========== Selected device =========="
          grep '^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_.*=y$' .config

          echo "========== Selected device count =========="
          echo "${target_count}"

      - name: Download source packages
        shell: bash
        run: |
          set -euo pipefail
          make download -j8

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)" V=s

      - name: Prepare firmware artifact
        shell: bash
        run: |
          set -euo pipefail

          output_dir="bin/targets/mediatek/mt7981"
          mkdir -p artifact

          sysupgrade="$(find "${output_dir}" \
            -maxdepth 1 \
            -type f \
            -name '*360-t7-108M*sysupgrade.bin' \
            -print -quit)"

          factory="$(find "${output_dir}" \
            -maxdepth 1 \
            -type f \
            -name '*360-t7-108M*factory.bin' \
            -print -quit)"

          test -n "${sysupgrade}"
          test -s "${sysupgrade}"

          test -n "${factory}"
          test -s "${factory}"

          control_path="$(tar -tf "${sysupgrade}" | sed -n '/\/CONTROL$/ {p; q;}')"

          test "${control_path}" = \
            "sysupgrade-mt7981-360-t7-108M/CONTROL"

          tar -xOf "${sysupgrade}" "${control_path}" | \
            grep -qx 'BOARD=mt7981-360-t7-108M'

          cp -v "${sysupgrade}" artifact/
          cp -v "${factory}" artifact/
          cp -v .config artifact/build.config
          cp -v feeds.conf.default artifact/feeds.conf.default

          printf '%s\n' "${SOURCE_REV}" > artifact/source-revision.txt

          (
            cd artifact
            sha256sum \
              *.bin \
              build.config \
              feeds.conf.default \
              source-revision.txt \
              > sha256sums
          )

          echo "========== Firmware artifact =========="
          ls -lh artifact/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-360t7-108M-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
