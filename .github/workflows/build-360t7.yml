name: Build ImmortalWrt 360T7 108M

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-360t7-108m-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      TZ: Asia/Shanghai
      SOURCE_REV: ba554197ed7e252fd3c1ee023621e1d1d009d323
      VERIFIED_CONFIG: configs/360t7-108M-verified.config

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v5
        with:
          ref: openwrt-21.02
          fetch-depth: 0

      - name: Preserve verified 360T7 configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s "${VERIFIED_CONFIG}"
          cp "${VERIFIED_CONFIG}" "${RUNNER_TEMP}/360t7-108M-verified.config"
          sha256sum "${RUNNER_TEMP}/360t7-108M-verified.config"

      - name: Pin source to verified revision
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_REV}^{commit}"
          git checkout --detach "${SOURCE_REV}"
          test "$(git rev-parse HEAD)" = "${SOURCE_REV}"
          echo "========== Source revision =========="
          git log -1 --oneline

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev libelf-dev \
            python3 python3-distutils rsync unzip zlib1g-dev file wget \
            device-tree-compiler qemu-utils

      - name: Pin feeds to verified revisions
        shell: bash
        run: |
          set -euo pipefail
          cat > feeds.conf.default <<'EOF'
          src-git-full packages https://github.com/immortalwrt/packages.git^e09f3c7d1
          src-git-full luci https://github.com/immortalwrt/luci.git^5829eabba5
          src-git-full routing https://github.com/openwrt/routing.git^a9e4310
          src-git-full telephony https://github.com/openwrt/telephony.git^920fbc5
          EOF
          cat feeds.conf.default

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "========== Feed revisions =========="
          for feed in packages luci routing telephony; do
            printf '%-10s %s\n' "$feed" "$(git -C "feeds/${feed}" rev-parse --short=12 HEAD)"
          done

      - name: Prepare verified single-device configuration
        shell: bash
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/360t7-108M-verified.config" .config
          make defconfig

          expected='CONFIG_TARGET_mediatek_mt7981_DEVICE_mt7981-360-t7-108M=y'
          grep -qx "${expected}" .config

          profile_count="$(grep -c '^CONFIG_TARGET_mediatek_mt7981_DEVICE_.*=y$' .config || true)"
          test "${profile_count}" -eq 1
          ! grep -qx 'CONFIG_TARGET_MULTI_PROFILE=y' .config
          ! grep -qx 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' .config

          echo "========== Selected profile =========="
          grep '^CONFIG_TARGET_mediatek_mt7981_DEVICE_.*=y$' .config
          echo "========== Profile count =========="
          echo "${profile_count}"

      - name: Download source packages
        shell: bash
        run: |
          set -euo pipefail
          make download -j8

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)" V=s

      - name: Prepare one sysupgrade artifact
        shell: bash
        run: |
          set -euo pipefail
          output_dir='bin/targets/mediatek/mt7981'
          firmware="${output_dir}/immortalwrt-mediatek-mt7981-mt7981-360-t7-108M-squashfs-sysupgrade.bin"
          artifact_dir='artifact'

          test -s "${firmware}"

          control_path="$(tar -tf "${firmware}" | sed -n '/\/CONTROL$/ {p; q;}')"
          test "${control_path}" = 'sysupgrade-mt7981-360-t7-108M/CONTROL'
          tar -xOf "${firmware}" "${control_path}" | grep -qx 'BOARD=mt7981-360-t7-108M'

          mkdir -p "${artifact_dir}"
          cp -v "${firmware}" "${artifact_dir}/"
          (
            cd "${artifact_dir}"
            sha256sum -- *.bin > SHA256SUMS
          )

          echo "========== Final artifact =========="
          ls -lh "${artifact_dir}"

      - name: Upload one sysupgrade firmware
        uses: actions/upload-artifact@v6
        with:
          name: immortalwrt-360t7-108M-sysupgrade-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
