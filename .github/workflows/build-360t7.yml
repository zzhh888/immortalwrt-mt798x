name: Build ImmortalWrt for 360 T7 108M

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-360t7-108m-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout verified source revision
        uses: actions/checkout@v4
        with:
          # 与你可正常使用的 13791 固件一致的主源码提交
          ref: ba55419
          fetch-depth: 1

      - name: Verify source revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --short=7 HEAD)" = "ba55419"
          echo "Verified source commit: $(git rev-parse --short=7 HEAD)"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev libelf-dev \
            python3 python3-distutils rsync unzip zlib1g-dev file wget \
            device-tree-compiler qemu-utils

      - name: Pin feeds to verified working revisions
        shell: bash
        run: |
          cat > feeds.conf.default <<'EOF'
          src-git-full packages https://github.com/immortalwrt/packages.git^e09f3c7d1
          src-git-full luci https://github.com/immortalwrt/luci.git^5829eabba5
          src-git-full routing https://github.com/openwrt/routing.git^a9e4310
          src-git-full telephony https://github.com/openwrt/telephony.git^920fbc5
          EOF

          echo "========== Pinned feeds =========="
          cat feeds.conf.default

      - name: Restore source-download cache
        uses: actions/cache@v4
        with:
          path: dl
          key: mt7981-ba55419-e09f3c7d1-5829eabba5-a9e4310-920fbc5
          restore-keys: |
            mt7981-ba55419-

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare 360 T7 108M configuration
        shell: bash
        run: |
          set -euo pipefail

          # 保留仓库原始 MT7981 基础配置。
          cp -f defconfig/mt7981-ax3000.config .config

          # 删除基础配置中默认勾选的全部 MT7981 设备。
          sed -i '/^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_/d' .config
          sed -i '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_/d' .config

          # 只选择与你当前路由器匹配的 360T7 108M UBI Profile。
          echo 'CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_mt7981-360-t7-108M=y' >> .config

          # 自动补全依赖与缺省配置。
          make defconfig

          # 强制检查：必须且只能存在一个 MT7981 设备 Profile。
          target_count="$(grep -c '^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_.*=y$' .config || true)"

          test "$target_count" -eq 1
          grep -qx \
            'CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_mt7981-360-t7-108M=y' \
            .config

          # 防止普通 36M Profile 被意外选中。
          if grep -qx \
            'CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_mt7981-360-t7=y' \
            .config; then
            echo "ERROR: Wrong 36M profile was selected."
            exit 1
          fi

          echo "========== Selected device =========="
          grep '^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_.*=y$' .config

          echo "========== Selected device count =========="
          echo "$target_count"

      - name: Download source packages
        run: |
          make download -j8

      - name: Build firmware
        run: |
          make -j"$(nproc)" V=s

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact

          sysupgrade="$(find bin/targets/mediatek/mt7981 \
            -maxdepth 1 \
            -type f \
            -name '*360-t7-108M*sysupgrade.bin' \
            -print -quit)"

          test -n "$sysupgrade"
          test -s "$sysupgrade"
          cp -v "$sysupgrade" artifact/

          factory="$(find bin/targets/mediatek/mt7981 \
            -maxdepth 1 \
            -type f \
            -name '*360-t7-108M*factory.bin' \
            -print -quit)"

          if [ -n "$factory" ]; then
            cp -v "$factory" artifact/
          fi

          cp -v .config artifact/build.config

          (
            cd artifact
            sha256sum *.bin build.config > sha256sums
          )

          echo "========== Firmware files =========="
          ls -lh artifact/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-360t7-108M-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
