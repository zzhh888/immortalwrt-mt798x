name: Build ImmortalWrt for 360 T7 108M

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-360t7-108m-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: openwrt-21.02
          fetch-depth: 1

      - name: Show source revision
        shell: bash
        run: |
          set -euo pipefail
          echo "========== Source revision =========="
          git log -1 --oneline
          git rev-parse HEAD

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses5-dev \
            libssl-dev \
            libelf-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            device-tree-compiler \
            qemu-utils

      - name: Pin feeds to verified 108M build revisions
        shell: bash
        run: |
          set -euo pipefail

          cat > feeds.conf.default <<'EOF'
          src-git-full packages https://github.com/immortalwrt/packages.git^e09f3c7d1
          src-git-full luci https://github.com/immortalwrt/luci.git^5829eabba5
          src-git-full routing https://github.com/openwrt/routing.git^a9e4310
          src-git-full telephony https://github.com/openwrt/telephony.git^920fbc5
          EOF

          echo "========== Pinned feeds =========="
          cat feeds.conf.default

      - name: Update and install feeds
        shell: bash
        run: |
          set -euo pipefail

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "========== Resolved feed revisions =========="
          for feed in packages luci routing telephony; do
            printf '%-10s %s\n' \
              "$feed" \
              "$(git -C "feeds/$feed" rev-parse --short=12 HEAD)"
          done

      - name: Prepare 360 T7 108M configuration
        shell: bash
        run: |
          set -euo pipefail

          cp -f defconfig/mt7981-ax3000.config .config

          # 删除基础配置中默认选中的所有 MT7981 设备 Profile。
          sed -i \
            -e '/^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_/d' \
            -e '/^CONFIG_TARGET_DEVICE_PACKAGES_mediatek_mt7981_DEVICE_/d' \
            -e '/^CONFIG_TARGET_MULTI_PROFILE=/d' \
            -e '/^# CONFIG_TARGET_MULTI_PROFILE is not set$/d' \
            -e '/^CONFIG_TARGET_PER_DEVICE_ROOTFS=/d' \
            -e '/^# CONFIG_TARGET_PER_DEVICE_ROOTFS is not set$/d' \
            .config

          # 固定为单一的 360T7 108M UBI Profile。
          cat >> .config <<'EOF'
          # CONFIG_TARGET_MULTI_PROFILE is not set
          # CONFIG_TARGET_PER_DEVICE_ROOTFS is not set
          CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_mt7981-360-t7-108M=y
          EOF

          make defconfig

          mapfile -t target_profiles < <(
            grep '^CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_.*=y$' .config || true
          )

          # 必须且只能存在一个设备 Profile。
          test "${#target_profiles[@]}" -eq 1

          # 必须是 360T7 108M，不允许误选普通 36M。
          test "${target_profiles[0]}" = \
            'CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_mt7981-360-t7-108M=y'

          ! grep -qx 'CONFIG_TARGET_MULTI_PROFILE=y' .config
          ! grep -qx 'CONFIG_TARGET_PER_DEVICE_ROOTFS=y' .config

          echo "========== Selected device =========="
          printf '%s\n' "${target_profiles[@]}"

          echo "========== Selected device count =========="
          echo "${#target_profiles[@]}"

      - name: Download source packages
        shell: bash
        run: |
          set -euo pipefail
          make download -j8

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)" V=s

      - name: Prepare sysupgrade artifact
        shell: bash
        run: |
          set -euo pipefail

          output_dir="bin/targets/mediatek/mt7981"
          artifact_dir="artifact"

          mkdir -p "${artifact_dir}"

          mapfile -t sysupgrade_files < <(
            find "${output_dir}" \
              -maxdepth 1 \
              -type f \
              -name '*360-t7-108M*sysupgrade.bin' \
              -print
          )

          # 最终必须且只能找到一个 360T7 108M sysupgrade 固件。
          test "${#sysupgrade_files[@]}" -eq 1

          sysupgrade="${sysupgrade_files[0]}"
          test -s "${sysupgrade}"

          # 核验 sysupgrade 内部设备标识，避免误上传其他型号固件。
          control_path="$(tar -tf "${sysupgrade}" | sed -n '/\/CONTROL$/ {p; q;}')"

          test "${control_path}" = \
            "sysupgrade-mt7981-360-t7-108M/CONTROL"

          tar -xOf "${sysupgrade}" "${control_path}" | \
            grep -qx 'BOARD=mt7981-360-t7-108M'

          # Artifact 内仅复制一个可刷写文件：sysupgrade.bin。
          cp -v "${sysupgrade}" "${artifact_dir}/"

          # 以下文件仅用于核验，不是固件。
          cp -v .config "${artifact_dir}/build.config"
          cp -v feeds.conf.default "${artifact_dir}/feeds.conf.default"
          git rev-parse HEAD > "${artifact_dir}/source-revision.txt"

          (
            cd "${artifact_dir}"

            sha256sum \
              *.bin \
              build.config \
              feeds.conf.default \
              source-revision.txt \
              > sha256sums
          )

          echo "========== Artifact files =========="
          ls -lh "${artifact_dir}"

      - name: Upload sysupgrade artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-360t7-108M-sysupgrade-${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
